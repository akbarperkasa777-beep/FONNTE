<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi Akun - Project API WhatsApp</title>
<style>
  :root{
    --primary:#128C7E; --primary-dark:#075E54; --bg:#f4f7f6;
    --danger:#d64545; --success:#1f9d55; --border:#dfe3e2;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); margin:0; padding:32px 16px;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh;
  }
  .card{
    background:#fff; width:100%; max-width:420px; border-radius:14px;
    padding:32px; box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition: all 0.3s ease;
  }
  h1{font-size:1.35rem; color:var(--primary-dark); margin:0 0 4px;}
  p.sub{color:#666; margin:0 0 24px; font-size:.9rem;}
  label{display:block; font-size:.85rem; font-weight:600; margin:16px 0 6px; color:#333;}
  input{
    width:100%; padding:11px 12px; border:1px solid var(--border);
    border-radius:8px; font-size:.95rem; outline:none; transition:.15s;
  }
  input:focus{border-color:var(--primary);}
  button{
    width:100%; margin-top:24px; padding:12px; border:none; border-radius:8px;
    background:var(--primary); color:#fff; font-size:1rem; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  button:hover{background:var(--primary-dark);}
  button:disabled{background:#9bb; cursor:not-allowed;}

  /* Result / Notifikasi */
  #result{
    margin-top:20px; padding:14px; border-radius:8px; 
    font-size:.88rem; display:none; line-height:1.5;
  }
  #result.success{
    display:block; background:#e8f8ee; border:1px solid var(--success); 
    color:#146c37; animation: slideDown 0.5s ease;
  }
  #result.error{
    display:block; background:#fdecec; border:1px solid var(--danger); 
    color:#a12727; animation: slideDown 0.5s ease;
  }
  #result.loading{
    display:block; background:#f0f4f8; border:1px solid #c0d0df;
    color:#2c3e50;
  }
  ul{margin:6px 0 0; padding-left:18px;}
  .wa-badge{
    display:inline-block; margin-top:8px; padding:3px 10px; 
    border-radius:20px; font-size:.78rem; font-weight:600;
  }
  .wa-terkirim{background:#d4f5df; color:#146c37;}
  .wa-gagal{background:#fde3e3; color:#a12727;}

  /* Halaman Sukses */
  .success-page {
    text-align: center;
    padding: 20px 0;
  }
  .success-page .icon {
    font-size: 64px;
    margin-bottom: 16px;
    display: block;
  }
  .success-page h2 {
    color: var(--success);
    margin: 0 0 8px;
  }
  .success-page .detail {
    text-align: left;
    background: #f8faf9;
    padding: 16px;
    border-radius: 8px;
    margin: 16px 0;
  }
  .success-page .detail-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #ecf0ef;
  }
  .success-page .detail-item:last-child {
    border-bottom: none;
  }
  .success-page .label {
    color: #666;
    font-weight: 500;
  }
  .success-page .value {
    color: #1a1a1a;
    font-weight: 600;
  }
  .btn-back {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 24px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    transition: .15s;
  }
  .btn-back:hover {
    background: var(--primary-dark);
  }

  /* Animasi */
  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card" id="app">
    <!-- Form Registrasi -->
    <div id="formContainer">
      <h1>Buat Akun Baru</h1>
      <p class="sub">Registrasi akan langsung mengirim notifikasi WhatsApp via Fonnte.</p>

      <form id="formRegister">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Budi Santoso" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="budi@gmail.com" required>

        <label for="no_hp">Nomor WhatsApp</label>
        <input type="text" id="no_hp" name="no_hp" placeholder="081234567890" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required minlength="6">

        <button type="submit" id="btnSubmit">Daftar Sekarang</button>
      </form>

      <div id="result"></div>
    </div>

    <!-- Halaman Sukses (akan ditampilkan setelah registrasi berhasil) -->
    <div id="successContainer" style="display:none;">
      <div class="success-page">
        <span class="icon">✅</span>
        <h2>Registrasi Berhasil!</h2>
        <p style="color:#666;">Akun Anda telah berhasil dibuat.</p>

        <div class="detail">
          <div class="detail-item">
            <span class="label">Nama</span>
            <span class="value" id="successNama">-</span>
          </div>
          <div class="detail-item">
            <span class="label">Email</span>
            <span class="value" id="successEmail">-</span>
          </div>
          <div class="detail-item">
            <span class="label">No. WhatsApp</span>
            <span class="value" id="successNoHp">-</span>
          </div>
          <div class="detail-item">
            <span class="label">Status WA</span>
            <span class="value" id="successWaStatus">-</span>
          </div>
        </div>

        <p style="font-size:.85rem; color:#666;">
          <span id="waNote">Notifikasi WhatsApp telah dikirim ke nomor Anda.</span>
        </p>

        <a href="#" class="btn-back" onclick="resetForm()">Daftar Lagi</a>
      </div>
    </div>
  </div>

<script>
const form = document.getElementById('formRegister');
const resultBox = document.getElementById('result');
const btnSubmit = document.getElementById('btnSubmit');
const formContainer = document.getElementById('formContainer');
const successContainer = document.getElementById('successContainer');

function showSuccess(data, waStatus, waNote) {
  formContainer.style.display = 'none';
  successContainer.style.display = 'block';
  
  document.getElementById('successNama').textContent = data.nama;
  document.getElementById('successEmail').textContent = data.email;
  document.getElementById('successNoHp').textContent = data.no_hp;
  
  let statusText = waStatus === 'terkirim' ? '✅ Terkirim' : '⚠️ Gagal';
  document.getElementById('successWaStatus').textContent = statusText;
  document.getElementById('waNote').textContent = waNote;
  
  // Scroll ke atas
  document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
}

function resetForm() {
  formContainer.style.display = 'block';
  successContainer.style.display = 'none';
  form.reset();
  resultBox.className = '';
  resultBox.style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  // Reset result
  resultBox.className = '';
  resultBox.style.display = 'none';
  
  // Disable button & show loading
  btnSubmit.disabled = true;
  btnSubmit.textContent = 'Memproses...';
  
  // Tampilkan loading
  resultBox.className = 'loading';
  resultBox.style.display = 'block';
  resultBox.innerHTML = '⏳ Sedang memproses registrasi...';

  const formData = new FormData(form);

  try {
    const res = await fetch('api/register.php', {
      method: 'POST',
      body: formData,
    });
    const data = await res.json();

    // Sembunyikan loading
    resultBox.style.display = 'none';

    if (data.status) {
      // Registrasi BERHASIL - Tampilkan halaman sukses
      const waStatus = data.notifikasi_whatsapp?.status || 'gagal';
      const waNote = data.notifikasi_whatsapp?.catatan || 'Notifikasi WhatsApp dikirim.';
      
      showSuccess(data.data, waStatus, waNote);
      form.reset();
    } else {
      // Registrasi GAGAL - Tampilkan error
      resultBox.classList.add('error');
      const listErr = data.errors ? `<ul>${data.errors.map(e => `<li>${e}</li>`).join('')}</ul>` : '';
      resultBox.innerHTML = `
        <strong>❌ ${data.message}</strong>
        ${listErr}
      `;
    }
  } catch (err) {
    resultBox.className = 'error';
    resultBox.style.display = 'block';
    resultBox.innerHTML = '<strong>❌ Terjadi kesalahan koneksi ke server.</strong>';
  } finally {
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Daftar Sekarang';
  }
});

// Auto-focus ke input pertama
document.getElementById('nama').focus();
</script>
</body>
</html>
